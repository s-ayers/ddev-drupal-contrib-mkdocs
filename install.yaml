name: drupal-contrib-mkdocs

project_files:
  - docker-compose.mkdocs.yaml
  - docs
  - commands

post_install_actions:
  - test -d ${DDEV_APPROOT}/docs || mkdir -p ${DDEV_APPROOT}/docs
  - test -f ${DDEV_APPROOT}/mkdocs.yml || cp docs/mkdocs.yml ${DDEV_APPROOT}/mkdocs.yml
  - test -f ${DDEV_APPROOT}/docs/index.md || printf '%s\n' '## Welcome to MkDocs' > ${DDEV_APPROOT}/docs/index.md
  - |
    docs_host="docs.${DDEV_SITENAME}.${DDEV_TLD}"
    if [ "${DDEV_ROUTER_HTTPS_PORT}" = "443" ]; then
      https_url="https://${docs_host}"
      http_url="http://${docs_host}"
    else
      https_url="https://${docs_host}:${DDEV_ROUTER_HTTPS_PORT}"
      http_url="http://${docs_host}:${DDEV_ROUTER_HTTP_PORT}"
    fi
    echo "Drupal contrib MkDocs add-on installed. Restart with 'ddev restart', then open:"
    echo "  ${https_url}"
    echo "  ${http_url}"
